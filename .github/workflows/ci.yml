name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      # le runner démarre vide : on récupère le code du dépôt
      - uses: actions/checkout@v7

      # Python 3.12 + cache pip basé sur requirements-dev.txt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: pytest -q --junitxml=reports/junit.xml

      # le rapport est publié même si les tests échouent (c'est là qu'il sert le plus)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: reports/junit.xml
