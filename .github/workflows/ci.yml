name: ci

on:
  push:
    branches: [main]
  pull_request:

# moindre privilège : lire le code, écrire sur GHCR
permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      # le runner démarre vide : on récupère le code du dépôt
      - uses: actions/checkout@v7

      # Python 3.12 + cache pip basé sur requirements-dev.txt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: pytest -q --junitxml=reports/junit.xml

      # le rapport est publié même si les tests échouent (c'est là qu'il sert le plus)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: reports/junit.xml

  build-push:
    # ne démarre que si le lint et les tests sont passés
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      # chaque job a sa propre machine : on refait le checkout
      - uses: actions/checkout@v7

      # GHCR refuse les majuscules : on met owner/dépôt en minuscules
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # login seulement sur main (sur une PR on construit sans pousser)
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
